{% extends 'boutique/base.html' %}

{% block title %}Supprimer {{ produit.nom }}{% endblock %}

{% block content %}
<div class="card border-danger">
  <div class="card-body">
    <h1 class="h4 text-danger">Confirmer la suppression</h1>
    <p>Es-tu sûr de vouloir supprimer <strong>{{ produit.nom }}</strong> ? Cette action est irréversible.</p>
    <form method="post" class="d-flex gap-2">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Oui, supprimer</button>
      <a href="{% url 'detail' produit.pk %}" class="btn btn-secondary">Annuler</a>
    </form>
  </div>
</div>
{% endblock %}
