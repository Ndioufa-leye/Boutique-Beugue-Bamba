{% extends 'boutique/base.html' %}
{% load bootstrap5 %}

{% block title %}Inscription{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card">
            <div class="card-body">
                <h4 class="mb-4">Créer un compte</h4>
                <form method="post">
                    {% csrf_token %}
                    {% bootstrap_form form %}
                    <button type="submit" class="btn btn-primary w-100 mt-3">S'inscrire</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Déjà un compte ? <a href="{% url 'connexion' %}">Connecte-toi</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
